name: Lint & Build

on:
  pull_request:
    branches:
      - main
      - develop
      - beta

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        check-latest: true

    - name: Install dependencies
      run: npm install --no-package-lock

    - name: Lint
      run: npm run lint

    - name: Format check
      run: npm run format:check

    - name: Build
      run: npm run build
