name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - beta

# Runs wait on the Release environment's manual approval, so pushes can pile up
# behind it. Keep at most one pending run per branch: a newer push cancels the
# older *pending* run (it would be stale by the time it's approved anyway), while
# cancel-in-progress: false never kills a run that's already publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    environment: Release
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Fetch all tags
      run: git fetch --tags --force
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
    - run: npm install --no-package-lock
      name: Install dependencies
    - run: npm run build:all
      name: Build all (Java agent, native server, TypeScript)
    - run: npm run lint
      name: Run NPM Lint
    - run: |
        Remove-Item -Recurse -Force package-lock.json, node_modules -ErrorAction SilentlyContinue
        npm prune --omit=dev --omit=peer --no-package-lock
      name: Remove dev dependencies and appium peer dependencies
    - run: npm shrinkwrap --omit=dev --omit=peer
      name: Create shrinkwrap
    - run: npm install --only=dev --no-package-lock
      name: Install dev dependencies for the release
    - run: npx semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Release

  publish-sdk:
    # WincoreServerSdk versions manually (bump <Version> in the csproj when the
    # ITreeProvider/IServerPlugin/ISessionContext contract changes) rather than via
    # semantic-release — the contract should change rarely, so this job just no-ops
    # on every other push to main instead of running a second automated-versioning
    # pipeline for a package that barely moves.
    runs-on: windows-latest
    environment: Release
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
    # Mirrors semantic-release's "local branch is behind the remote" check: if main
    # moved on while this run waited for approval, publish nothing and let the newer
    # run handle it. Tagging a stale commit whose workflow files differ from main's
    # is rejected for GITHUB_TOKEN (no `workflows` permission), which left 1.1.0 on
    # NuGet without its sdk-v tag.
    - name: Decide whether to publish this SDK version
      id: sdkver
      shell: bash
      run: |
        VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" csharp/WincoreServerSdk/WincoreServerSdk.csproj)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        git fetch --depth=1 origin main
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
          echo "::notice::main has moved past $GITHUB_SHA; skipping SDK publish (a newer run will handle it)"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          "https://api.nuget.org/v3-flatcontainer/wincoreserversdk/$VERSION/wincoreserversdk.$VERSION.nupkg")
        if [ "$STATUS" = "200" ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Pack WincoreServerSdk
      if: steps.sdkver.outputs.publish == 'true'
      run: dotnet pack csharp/WincoreServerSdk/WincoreServerSdk.csproj -c Release -o ./nupkg
    # NuGet trusted publishing: exchanges this job's GitHub OIDC token for a
    # short-lived NuGet API key (unlike npm, NuGet has no built-in OIDC support in
    # the CLI itself — the login action is required and its output key must be
    # passed to `dotnet nuget push` explicitly). No secret stored in the repo or org.
    - name: NuGet login (trusted publishing)
      if: steps.sdkver.outputs.publish == 'true'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: Yuri-Schwab
    - name: Push WincoreServerSdk to NuGet
      if: steps.sdkver.outputs.publish == 'true'
      shell: pwsh
      run: |
        $pkg = Get-ChildItem ./nupkg/*.nupkg | Select-Object -First 1
        dotnet nuget push $pkg.FullName `
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
          --source https://api.nuget.org/v3/index.json `
          --skip-duplicate
    - name: Tag the published SDK version
      if: steps.sdkver.outputs.publish == 'true'
      run: |
        git tag "sdk-v${{ steps.sdkver.outputs.version }}"
        git push origin "sdk-v${{ steps.sdkver.outputs.version }}"
