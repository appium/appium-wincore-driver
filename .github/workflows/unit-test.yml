name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - beta

jobs:
  node_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  test:
    needs:
      - node_matrix
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.node_matrix.outputs.versions) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock
        name: Install dev dependencies
      - run: npm run test
        name: Run unit tests

  csharp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test csharp/WincoreServer.Tests/WincoreServer.Tests.csproj -c Release
        name: Run C# unit tests
