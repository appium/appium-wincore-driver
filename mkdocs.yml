site_name: Appium WinCore Driver
site_description: >-
  Windows desktop UI automation for Appium — UWP, WinForms, WPF, Win32,
  WebView2 and Internet Explorer via real UI Automation.
site_url: https://appium.github.io/appium-wincore-driver/
site_author: VeriSoft
repo_url: https://github.com/appium/appium-wincore-driver
repo_name: appium/appium-wincore-driver
edit_uri: edit/main/docs/
copyright: Copyright &copy; VeriSoft — Apache-2.0 licensed

docs_dir: docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/verisoft-logo.png
  favicon: assets/images/favicon.png
  font:
    text: Heebo
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/verisoft.css

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/appium/appium-wincore-driver
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/appium-wincore-driver
    - icon: material/web
      link: https://www.verisoft.ai/en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Quickstart:
      - quickstart/index.md
      - Your first test: quickstart/first-test.md
  - Guides:
      - guides/index.md
      - Examples: guides/examples.md
      - W3C Actions: guides/actions.md
      - WebView and CDP: guides/webview.md
      - Internet Explorer: guides/internet-explorer.md
  - Reference:
      - reference/index.md
      - Capabilities: reference/capabilities.md
      - Locator Strategies: reference/locators.md
      - Extension Commands: reference/commands.md
  - Architecture:
      - architecture/index.md
      - Server plugins: architecture/server-plugins.md
  - Contributing:
      - contributing/index.md
      - Performance: contributing/performance.md
